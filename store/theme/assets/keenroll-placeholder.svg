<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Illustration of the Keenroll rolling sharpener and magnetic angle block (placeholder until real photos are added)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3E9DA"/><stop offset="1" stop-color="#E6D6BF"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A52"/><stop offset=".5" stop-color="#8A5A3B"/><stop offset="1" stop-color="#6A4329"/></linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9DDE0"/><stop offset="1" stop-color="#8E979F"/></linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F6F7"/><stop offset="1" stop-color="#AEB6BD"/></linearGradient>
    <pattern id="grit" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#6f777e"/><circle cx="6" cy="6" r=".8" fill="#5f666d"/></pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- table shadow -->
  <ellipse cx="400" cy="640" rx="320" ry="40" fill="#000" opacity=".08"/>
  <!-- magnetic block -->
  <g transform="translate(150 430)">
    <path d="M0 200 L260 200 L260 40 L60 40 Z" fill="#1C1D1F"/>
    <path d="M60 40 L260 40 L280 20 L80 20 Z" fill="#3a3c40"/>
    <path d="M260 200 L280 180 L280 20 L260 40 Z" fill="#2a2b2e"/>
    <text x="170" y="150" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#E8692C" text-anchor="middle">15° · 20°</text>
  </g>
  <!-- knife held on block -->
  <g transform="rotate(-14 420 420)">
    <path d="M210 395 L640 395 C640 395 600 460 470 470 L210 470 Z" fill="url(#blade)" stroke="#8E979F" stroke-width="2"/>
    <path d="M222 466 L560 466" stroke="#fff" stroke-width="3" opacity=".9"/>
    <rect x="70" y="400" width="150" height="62" rx="18" fill="#1C1D1F"/>
    <circle cx="110" cy="431" r="6" fill="#9AA3AB"/><circle cx="170" cy="431" r="6" fill="#9AA3AB"/>
  </g>
  <!-- roller -->
  <g transform="translate(470 360)">
    <ellipse cx="0" cy="130" rx="70" ry="130" fill="url(#disc)"/>
    <ellipse cx="0" cy="130" rx="56" ry="112" fill="url(#grit)" opacity=".7"/>
    <rect x="0" y="0" width="190" height="260" fill="url(#wood)"/>
    <path d="M0 40 H190 M0 92 H190 M0 170 H190 M0 220 H190" stroke="#5c3a24" stroke-width="2" opacity=".35"/>
    <ellipse cx="190" cy="130" rx="70" ry="130" fill="#C9CED2"/>
    <ellipse cx="190" cy="130" rx="54" ry="108" fill="#ECEFF1"/>
    <ellipse cx="190" cy="130" rx="16" ry="32" fill="#8A5A3B"/>
  </g>
  <!-- edge spark -->
  <path d="M600 220 l14 -40 l14 40 l40 14 l-40 14 l-14 40 l-14 -40 l-40 -14 z" fill="#E8692C"/>
  <text x="400" y="110" font-family="Fraunces,Georgia,serif" font-size="44" font-weight="700" fill="#1C1D1F" text-anchor="middle">keenroll</text>
  <text x="400" y="150" font-family="Inter,Arial,sans-serif" font-size="20" fill="#6b5a48" text-anchor="middle">Illustration — replace with your own product photo</text>
</svg>
