[project]
name = "adgen"
version = "0.1.0"
description = "AI video ad generator: product brief in, finished talking-presenter video ads out."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "elevenlabs>=2.70",
    "fal-client>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pillow>=10.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
adgen = "adgen.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adgen*"]

[tool.setuptools.package-data]
adgen = ["pricing.yaml", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
